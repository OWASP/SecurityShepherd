title.question.m_security_misconfiguration = 什么是移动安全配置错误?

paragraph.info.1 = Android 组件——Activity、Service、BroadcastReceiver 和 ContentProvider——可以在应用清单文件中被声明为可导出（exported）。可导出的组件可以被设备上安装的任何其他应用调用，且无需任何权限。当一个可导出的 Activity 执行敏感操作或显示敏感数据时，这就构成了安全漏洞。

paragraph.info.2 = 本课程演示如何使用 ADB 识别 Security Shepherd 移动应用中的可导出组件，以及如何直接调用它们以泄露敏感信息。

paragraph.info.3 = 使用 ADB 列出应用中所有可导出的 Activity：<code>adb shell dumpsys package org.owasp.mobileshepherd | grep -A1 'Activity'</code> 找到一个被导出的 Activity，然后直接调用它：<code>adb shell am start -n org.owasp.mobileshepherd/.ui.&lt;ActivityName&gt;</code>

paragraph.info.4 = OWASP 指出，应用应对组件导出遵循最小权限原则：只导出确实需要被其他应用访问的 Activity、Service 和 ContentProvider。开发者有时会假设导出的组件只会通过预期的界面被访问——但实际上，任何可导出的组件都可以被设备上的任何应用访问，无论访问方式如何。

