title.question.m_security_misconfiguration = What is Mobile Security Misconfiguration?

paragraph.info.1 = Android components — Activities, Services, BroadcastReceivers and ContentProviders — can be declared as exported in the <a href="https://developer.android.com/guide/topics/manifest/manifest-intro" target="_blank">application manifest</a>. An exported component can be invoked by any other application installed on the device, without requiring any permissions. When an exported Activity performs a sensitive operation or displays sensitive data, this becomes a security vulnerability.

paragraph.info.2 = This lesson demonstrates how to identify exported components in the Security Shepherd mobile app using <a href="https://developer.android.com/tools/adb" target="_blank">ADB</a>, and how to invoke them directly to leak sensitive information.

paragraph.info.3 = Use <a href="https://developer.android.com/tools/adb" target="_blank">ADB</a> to list all exported Activities in the app: <code>adb shell dumpsys package org.owasp.mobileshepherd | grep -A1 'Activity'</code> Look for an Activity that is exported. Invoke it directly: <code>adb shell am start -n org.owasp.mobileshepherd/.ui.&lt;ActivityName&gt;</code>

paragraph.info.4 = OWASP notes that apps should apply the principle of least privilege to their component exports: only export Activities, Services and ContentProviders that genuinely need to be reachable by other apps. Developers sometimes export components assuming they will only be accessed through the intended UI — but any exported component is reachable by any app on the device, regardless of how it is reached.

