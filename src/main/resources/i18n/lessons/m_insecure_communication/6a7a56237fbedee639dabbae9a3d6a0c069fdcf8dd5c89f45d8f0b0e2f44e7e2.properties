title.question.m_insecure_communication = What is Mobile Insecure Communication?

paragraph.info.1 = Mobile applications that transmit sensitive data over unencrypted HTTP channels expose that data to anyone with access to the same network — or to any intercepting proxy. This is a violation of the principle of secure transport, and is categorised as M5 in the OWASP Mobile Top 10.

paragraph.info.2 = This lesson demonstrates how to configure a proxy tool such as <a href="https://portswigger.net/burp" target="_blank">Burp Suite</a> or <a href="https://mitmproxy.org/" target="_blank">mitmproxy</a> to intercept plaintext HTTP traffic generated by an Android device, and how to read data that should have been transmitted securely.

paragraph.info.3 = Set up <a href="https://portswigger.net/burp" target="_blank">Burp Suite</a> as a proxy on your machine and configure your Android device to route traffic through it. The app sends an HTTP (not HTTPS) request. Intercept it and look for the flag in the JSON response body.

paragraph.info.4 = OWASP points out that even apps that do use TLS can be vulnerable through subtle implementation flaws: accepting self-signed or expired certificates, negotiating a weak cipher suite, or applying HTTPS only on the login flow but not on subsequent API calls. An adversary on the same Wi-Fi network — or a rogue carrier — can exploit any of these inconsistencies to intercept credentials, session tokens or sensitive data in transit.

