title.question.m_insecure_communication = 什么是移动不安全通信?

paragraph.info.1 = 通过未加密的 HTTP 通道传输敏感数据的移动应用，会将这些数据暴露给同一网络上的任何人，或任何拦截代理。这违反了安全传输的基本原则，在 OWASP 移动安全 Top 10 中被归类为 M5。

paragraph.info.2 = 本课程演示如何配置 Burp Suite 或 mitmproxy 等代理工具，拦截 Android 设备产生的明文 HTTP 流量，并读取本应安全传输的数据。

paragraph.info.3 = 在电脑上将 Burp Suite 设置为代理，并配置 Android 设备通过该代理路由流量。应用会发送一个 HTTP（非 HTTPS）请求，拦截该请求并在 JSON 响应体中查找 flag。

paragraph.info.4 = OWASP 指出，即使使用了 TLS 的应用也可能因细微的实现缺陷而存在漏洞：接受自签名或过期证书、协商使用弱加密套件，或仅在登录流程中使用 HTTPS 而后续 API 调用却不使用。同一 Wi-Fi 网络上的攻击者，或恶意运营商，都可以利用这些不一致之处拦截凭据、会话令牌或传输中的敏感数据。

