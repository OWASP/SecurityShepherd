challenge.description = Typically an Android app will store its database in the <a>/data/data/org.owasp.mobileshepherd/databases/</a> directory. Anyone with a rooted device can access this directory. The Android App for this lesson stores credentials in an <a>SQLite database</a>. The Admin's password is the result key to this lesson.