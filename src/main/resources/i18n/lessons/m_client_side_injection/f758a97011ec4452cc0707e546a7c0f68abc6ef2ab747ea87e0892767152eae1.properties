title.question.csi = What is Mobile Client Side Injection?

paragraph.info.1 = Client Side Injection occurs when the user can execute SQLite commands through application input in order to change the query run by an App. The lesson database is encrypted with SQLCipher, so stealing the raw .db file yields only ciphertext \u2014 the only viable attack is injection through the app's own query interface. The lesson presents a user search field that concatenates input directly into a SQL query. An attacker can inject SQL to return rows that are not visible through a normal search, including hidden records containing sensitive data.
paragraph.info.2 = An ineffective defence against Client Side Injection is <a>Filtering user input</a>. This technique involves predicting which keywords an attacker would use — such as SELECT, WHERE or FROM — and replacing them with a dot or blank space. Filtering will make exploitation more difficult but will not stop a determined attacker, since filters can often be bypassed with alternative syntax, SQL comments, or encoded characters. The correct defence is to use parameterised queries (prepared statements) with bound parameters, which separate data from SQL logic entirely and make injection structurally impossible.
paragraph.info.3 = A security system is only as strong as its weakest link. The lesson presents a user search that concatenates input directly into a SQL SELECT statement. If the query returns any rows, those rows are displayed \u2014 an attacker can inject conditions to broaden or change the results.

