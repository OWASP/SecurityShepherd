title.question.m_input_validation = What is Mobile Input Validation?

paragraph.info.1 = Input validation on mobile applications is intended to stop untrusted data reaching sensitive application logic. When a validation check inspects the raw text of an input instead of its parsed meaning - for example, checking whether a URL <em>starts with</em> a trusted domain name rather than comparing the host the URL actually points to - an attacker can craft input that satisfies the check while still reaching somewhere unintended.

paragraph.info.2 = This lesson demonstrates how a weak allow-list check in the Security Shepherd mobile app's deep link handler can be bypassed. The app loads links in an embedded browser (a WebView) and only accepts links to one trusted site, but the check is made against the URL string. Links are delivered to the app as an Android <a href="https://developer.android.com/guide/navigation/navigation-deep-link" target="_blank">deep link</a>.

paragraph.info.3 = Use <a href="https://developer.android.com/tools/adb" target="_blank">ADB</a> to send a deep link directly to the app: <code>adb shell am start -a android.intent.action.VIEW -d "myapp://open?url=&lt;TARGET_URL&gt;"</code> Work out how to write a URL that passes the check yet loads a page from a different host. Once an untrusted page is loaded in the WebView, consider what the app has exposed to it: the app registers a JavaScript interface for its own trusted page, and a WebView offers that interface to every page it loads.

paragraph.info.4 = OWASP highlights that insufficient input/output validation is not just a client-side problem: the same unvalidated data reaching a backend server can trigger SQL injection, command injection, XSS or path traversal. The correct fix is precise validation against the full, parsed value - such as an exact host match after parsing the URL - never a prefix or substring check on the raw string. Output matters too: expose JavaScript interfaces only to the origins that need them, or not at all.

