title.question.m_input_validation = What is Mobile Input Validation?

paragraph.info.1 = Input validation on mobile applications is intended to prevent malicious or malformed data from reaching sensitive application logic. When a validation check inspects the wrong part of an input — for example, checking whether a trusted substring appears anywhere in a URL's host, rather than validating the host precisely — an attacker can craft input that satisfies the check while still reaching unintended functionality.

paragraph.info.2 = This lesson demonstrates how weak host validation in the Security Shepherd mobile app's deep link handler can be bypassed using a crafted URL, delivered directly to the app via an Android <a href="https://developer.android.com/guide/navigation/navigation-deep-link" target="_blank">deep link</a>.

paragraph.info.3 = Use <a href="https://developer.android.com/tools/adb" target="_blank">ADB</a> to send a deep link directly to the app: <code>adb shell am start -a android.intent.action.VIEW -d "myapp://open?url=&lt;TARGET_URL&gt;"</code> The app only allows hosts that <em>contain</em> an approved domain name, and separately reveals hidden content for hosts that <em>contain</em> "admin.internal" — craft a single host that satisfies both checks at once.

paragraph.info.4 = OWASP highlights that insufficient input/output validation is not just a client-side problem: the same unvalidated data reaching a backend server can trigger SQL injection, command injection, XSS or path traversal. The correct fix is precise validation against the full, parsed value — such as an exact host match or an allow-list comparison — never a substring <code>contains()</code> check, and never relying on the client alone to enforce constraints.

