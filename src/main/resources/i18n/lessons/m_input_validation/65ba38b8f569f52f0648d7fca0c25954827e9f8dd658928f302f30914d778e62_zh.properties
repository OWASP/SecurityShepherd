title.question.m_input_validation = 什么是移动输入验证?

paragraph.info.1 = 移动应用上的输入验证旨在防止恶意或格式错误的数据到达敏感的应用逻辑。当验证检查审查的是输入的错误部分时——例如，检查一个受信任的子字符串是否出现在 URL 主机部分的任意位置，而不是精确验证主机本身——攻击者就可以构造出既能通过检查、又能到达非预期功能的输入。

paragraph.info.2 = 本课程演示 Security Shepherd 移动应用深层链接（deep link）处理程序中较弱的主机验证，如何通过一个精心构造的 URL 被绕过，该 URL 通过 Android 深层链接直接传递给应用。

paragraph.info.3 = 使用 ADB 直接向应用发送深层链接：<code>adb shell am start -a android.intent.action.VIEW -d "myapp://open?url=&lt;TARGET_URL&gt;"</code> 应用仅允许主机中“包含”某个受信任的域名，同时会为主机中“包含” "admin.internal" 的情况单独显示隐藏内容——构造一个能同时满足这两项检查的主机。

paragraph.info.4 = OWASP 强调，输入/输出验证不足不仅仅是客户端的问题：同样未经验证的数据到达后端服务器时，可能引发 SQL 注入、命令注入、XSS 或路径遍历。正确的修复方法是针对完整、已解析的值进行精确验证——例如精确的主机匹配或允许列比较——而绝不能使用子字符串 contains() 检查，也绝不能仅依靠客户端来强制执行约束。

