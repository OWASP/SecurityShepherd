title.question.m_reverse_engineering = What is Mobile Reverse Engineering?

paragraph.info.1 = Reverse engineering remains one of the most significant threats to mobile applications. With relatively little effort, an attacker can extract source code, API keys, encryption keys, hidden administrative functions, or hard-coded credentials. Developers often rely on code obfuscation to make this process more difficult, and in some cases, it is the only practical layer of defense available.
paragraph.info.2 = ProGuard ships with the Android SDK and helps optimize, shrink, and obfuscate code. Obfuscation complicates reverse engineering but doesn't secure the app. It's useful and should be used routinely, yet it only delays attackers rather than preventing exposure of sensitive data.
paragraph.info.3 = Beyond renaming symbols, developers may use algorithmic key validation — instead of comparing user input against a hardcoded string, the app might pass the input through a custom encoding function or hash and compare the result. Some apps use native C/C++ libraries (compiled with the Android NDK) to hide sensitive logic from Java-level decompilers, requiring additional tools such as Ghidra or IDA Pro to analyse. Modern Android toolchains include the R8/D8 minifier, which shrinks and renames identifiers at build time. None of these measures prevent a skilled attacker from understanding the logic — they only increase the time required. Sensitive values and secrets should never exist in the app binary at all.

challenge.description = To reverse engineer an APK, use a tool such as <a>jadx</a> or <a>apktool</a>. Decompile the Security Shepherd APK and investigate the source code to retrieve the result key.

