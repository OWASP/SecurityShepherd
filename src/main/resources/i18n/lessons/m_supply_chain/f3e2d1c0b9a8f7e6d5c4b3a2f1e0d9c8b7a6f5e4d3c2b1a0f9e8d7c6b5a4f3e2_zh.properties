title.question.m_supply_chain = 什么是移动供应链控制不足?

paragraph.info.1 = 移动应用通常依赖第三方库和 SDK 来实现分析、广告和网络等功能。在应用中包含存在漏洞或恶意的依赖项，会带来开发者可能无法察觉的风险。这在 OWASP 移动安全 Top 10 中被归类为 M2。

paragraph.info.2 = 本课程演示 Security Shepherd 移动应用中包含的一个存在漏洞的第三方库，如何通过冗长的调试日志输出暂露敏感信息。使用 <code>adb logcat</code> 捕获设备日志并定位 flag。

paragraph.info.3 = 在应用中打开供应链课程，然后运行：<code>adb logcat -s VulnerableLibrary</code> 观察日志输出——当课程界面被打开时，存在漏洞的依赖项会以明文形式将 flag 输出到 logcat。

paragraph.info.4 = OWASP 指出，第三方库和 SDK 会引入开发者可能无法察觉的风险。存在漏洞的依赖项可被利用来窃取数据、注入恶意软件或获得未经授权的访问——即使漏洞源自应用自身代码之外，应用开发者仍需承担责任。应只包含受信任且积极维护的依赖项，将其固定到特定版本，并使用 OWASP Dependency-Check 等工具定期审核。

