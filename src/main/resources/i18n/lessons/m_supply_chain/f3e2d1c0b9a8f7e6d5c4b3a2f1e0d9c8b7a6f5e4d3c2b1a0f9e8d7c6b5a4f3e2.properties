title.question.m_supply_chain = What is Mobile Inadequate Supply Chain Controls?

paragraph.info.1 = Mobile applications commonly rely on third-party libraries and SDKs for functionality such as analytics, advertising and networking. Including a vulnerable or malicious dependency in an app introduces risk that may be invisible to the developer. This is categorised as M2 in the OWASP Mobile Top 10.

paragraph.info.2 = This lesson demonstrates how a vulnerable third-party library included in the Security Shepherd mobile app exposes sensitive information through verbose debug log output. Use <a href="https://developer.android.com/tools/logcat" target="_blank"><code>adb logcat</code></a> to capture the device log and locate the flag.

paragraph.info.3 = Open the Supply Chain lesson in the app, then run: <code>adb logcat -s VulnerableLibrary</code> Watch the log output — the vulnerable dependency prints the flag in plaintext to logcat when the lesson screen is opened.

paragraph.info.4 = OWASP notes that third-party libraries and SDKs introduce risk that can be invisible to the app developer. A vulnerable dependency can be exploited to steal data, inject malware or gain unauthorized access — and the app developer bears responsibility even though the vulnerability originated outside their own code. Only include trusted, actively maintained dependencies, pin them to specific versions, and audit them regularly using tools such as <a href="https://owasp.org/www-project-dependency-check/" target="_blank">OWASP Dependency-Check</a>.

