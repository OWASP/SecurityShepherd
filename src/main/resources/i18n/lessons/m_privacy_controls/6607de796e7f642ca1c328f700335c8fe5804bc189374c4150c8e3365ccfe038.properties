title.question.m_privacy_controls = What is Mobile Privacy Controls?

paragraph.info.1 = Mobile applications sometimes embed sensitive information in file metadata without the developer realising. <a href="https://en.wikipedia.org/wiki/Exif" target="_blank">EXIF (Exchangeable Image File Format)</a> data, for example, can contain GPS coordinates, device identifiers, timestamps and other details that were never intended to be shared publicly.

paragraph.info.2 = This lesson demonstrates how to extract and read metadata embedded within image files served by the Security Shepherd mobile app using a tool such as <a href="https://exiftool.org/" target="_blank">ExifTool</a>.

paragraph.info.3 = In the app, tap <strong>Load Sample Image</strong> to load the preloaded photo, then tap <strong>Analyze Metadata</strong> to view all EXIF fields displayed on screen. The key is hidden in one of the EXIF tags.

paragraph.info.4 = OWASP defines this risk broadly as inadequate protection of Personally Identifiable Information (PII) — which includes not just obvious fields like names and addresses, but also GPS coordinates, device identifiers, and timestamps embedded in file metadata. The recommended first step is data minimisation: never collect or retain PII that is not strictly necessary, and strip sensitive metadata before sharing any user-generated files.

