title.question.m_privacy_controls = 什么是移动隐私控制?

paragraph.info.1 = 移动应用有时会在文件元数据中嵌入敏感信息，而开发者本人可能并未意识到。例如，EXIF（可交换图像文件格式）数据可能包含 GPS 坐标、设备标识符、时间戳等从未打算公开分享的详细信息。

paragraph.info.2 = 本课程演示如何使用 ExifTool 等工具提取并读取 Security Shepherd 移动应用提供的图像文件中嵌入的元数据。

paragraph.info.3 = 在应用中，点击“加载示例图片”以加载预置照片，然后点击“分析元数据”以在屏幕上查看所有 EXIF 字段。密钥隐藏在其中一个 EXIF 标签中。

paragraph.info.4 = OWASP 将此风险广义地定义为个人身份信息（PII）保护不足——这不仅包括姓名、地址等明显字段，还包括嵌入在文件元数据中的 GPS 坐标、设备标识符和时间戳。建议的第一步是数据最小化：切勿收集或保留非必需的 PII，并在共享任何用户生成的文件之前清除敏感元数据。

