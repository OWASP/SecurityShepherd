title.question.m_insecure_authorization = What is Mobile Insecure Authorization?

paragraph.info.1 = Insecure authorization occurs when a mobile application enforces access controls purely on the client side. A common pattern is storing a user role or permission flag in Android <a href="https://developer.android.com/reference/android/content/SharedPreferences" target="_blank">SharedPreferences</a>. Because SharedPreferences files are stored in the app's data directory, a user with a rooted device or <a href="https://developer.android.com/tools/adb" target="_blank">ADB</a> access can read and modify those values directly, escalating their own privileges without any server-side check.

paragraph.info.2 = This lesson demonstrates how client-side authorization can be bypassed by modifying a locally stored role value in the Security Shepherd mobile app.

paragraph.info.3 = Log in to the app with the demo credentials. Use <a href="https://developer.android.com/tools/adb" target="_blank">ADB</a> to inspect the app's SharedPreferences: <code>adb shell run-as org.owasp.mobileshepherd cat shared_prefs/UserSession.xml</code> Find the <code>user_role</code> value and change it from <code>user</code> to <code>admin</code>.

paragraph.info.4 = OWASP states that backend systems must independently verify the roles and permissions of the authenticated user — never trusting role or permission data transmitted from the mobile device. The risk is heightened when authorization decisions are made on the device rather than the server, particularly when offline usability requirements push developers toward client-side checks. All client-side authorization controls must be assumed bypassable.

