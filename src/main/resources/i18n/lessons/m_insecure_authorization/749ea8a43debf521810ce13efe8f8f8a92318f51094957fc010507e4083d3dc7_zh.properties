title.question.m_insecure_authorization = 什么是移动不安全授权?

paragraph.info.1 = 当移动应用仅在客户端强制执行访问控制时，就会出现不安全授权问题。一种常见模式是将用户角色或权限标志存储在 Android SharedPreferences 中。由于 SharedPreferences 文件存储在应用的数据目录中，拥有已 root 设备或 ADB 访问权限的用户可以直接读取并修改这些值，从而在没有任何服务器端检查的情况下提升自己的权限。

paragraph.info.2 = 本课程演示如何通过修改 Security Shepherd 移动应用中本地存储的角色值来绕过客户端授权。

paragraph.info.3 = 使用演示凭据登录应用。使用 ADB 检查应用的 SharedPreferences：<code>adb shell run-as org.owasp.mobileshepherd cat shared_prefs/UserSession.xml</code> 找到 user_role 的值，并将其从 user 改为 admin。

paragraph.info.4 = OWASP 指出，后端系统必须独立验证已认证用户的角色和权限——绝不能信任从移动设备传输来的角色或权限数据。当授权决策在设备上而非服务器上做出时，风险会进一步加剧，尤其是当离线可用性需求促使开发者采用客户端检查时。所有客户端授权控制都必须被视为可被绕过的。

