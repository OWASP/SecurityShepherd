title.question.m_poor_authentication = What is Poor Authentication?

paragraph.info.1 = Poor Authentication occurs when a mobile application relies on an insecure mechanism to verify a user's identity. Common examples include accepting weak or default passwords, storing credentials in plaintext, using predictable or short-lived session tokens, failing to enforce lockout policies after repeated failed attempts, or relying on a client-side value to determine whether a user is logged in. Because Android applications can be decompiled and run-time state can be inspected on rooted devices, any authentication check that happens purely on the device is vulnerable.
paragraph.info.2 = One frequently overlooked weakness is verbose application logging. Android's <a>Logcat</a> output is readable by any application with the READ_LOGS permission, and on many devices log history persists between sessions. An app that logs user input, session tokens, or authentication codes is inadvertently making that data available to an attacker with USB access or a malicious background process. Similarly, insecure password reset flows — for example, those that rely on a static token, a guessable email link, or a value visible in the UI — allow an attacker to take over an account without ever knowing the original password.
paragraph.info.3 = Authentication is the process of verifying that a user is who they claim to be. Authorization is the process of verifying that an authenticated user has permission to access a particular resource or perform a particular action. The two are often confused: an application that performs authentication correctly but grants all authenticated users admin privileges has an authorization failure, not an authentication failure. Both must be enforced server-side — the mobile app should never be trusted as the source of truth for either.

