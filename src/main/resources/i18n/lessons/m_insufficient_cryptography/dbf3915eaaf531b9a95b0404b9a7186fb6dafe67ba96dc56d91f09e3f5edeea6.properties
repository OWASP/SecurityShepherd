title.question.m_insufficient_cryptography = What is Mobile Insufficient Cryptography?

paragraph.info.1 = Insufficient cryptography occurs when a mobile application uses deprecated or weak encryption algorithms, short key lengths, insecure modes of operation, or poor key management. Common examples include using DES (56-bit key), RC4, MD5 or SHA-1 for security-sensitive operations, using ECB block cipher mode (which leaks patterns in plaintext), hardcoding encryption keys in source code, or deriving keys from static or guessable values.

paragraph.info.2 = Even when a well-known algorithm such as AES is chosen, a flawed implementation — for example, a static initialisation vector or a key that is simply the app's package name — can make the encryption trivially breakable. Because mobile applications can be decompiled, any key or algorithm choice embedded in the APK is visible to an attacker.

paragraph.info.3 = This lesson demonstrates how to identify and exploit weak cryptography in the Security Shepherd mobile app: the app encrypts a stored value using a short, guessable key. Intercept or extract the ciphertext and crack the key to read the plaintext.

paragraph.info.4 = In the app, trigger the encryption action and use a proxy or ADB to observe the ciphertext being stored or transmitted. Decompile the APK with <a href="https://github.com/skylot/jadx" target="_blank">jadx</a> to locate the encryption routine and identify the algorithm and key. Use a tool such as <a href="https://cyberchef.org/" target="_blank">CyberChef</a> to decrypt the value once you have identified the key.

paragraph.info.5 = OWASP identifies the most common cryptographic failures as: using deprecated algorithms (DES, RC4, MD5 for security purposes), insufficient key length, ECB block cipher mode (which reveals plaintext patterns in the ciphertext), static initialisation vectors, and poor key management — such as hardcoding keys in source code or storing them in accessible locations. Because Android APKs can be decompiled with tools like jadx, any key or algorithm choice embedded in the app binary is visible to an attacker.

