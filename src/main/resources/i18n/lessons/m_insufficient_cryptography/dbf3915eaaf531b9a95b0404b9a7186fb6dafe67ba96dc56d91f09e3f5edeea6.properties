title.question.m_insufficient_cryptography = What is Mobile Insufficient Cryptography?

paragraph.info.1 = Insufficient cryptography occurs when a mobile application uses deprecated or weak encryption algorithms, short key lengths, insecure modes of operation, or poor key management. Common examples include using DES (56-bit key), RC4, MD5 or SHA-1 for security-sensitive operations, using ECB block cipher mode (which leaks patterns in plaintext), hardcoding encryption keys in source code, or deriving keys from static or guessable values.

paragraph.info.2 = Even when a well-known algorithm such as AES is chosen, a flawed implementation, for example a static initialisation vector or a key that is simply the app's package name, can make the encryption trivially breakable. Because mobile applications can be decompiled, any key or algorithm choice embedded in the APK is visible to an attacker.

paragraph.info.3 = In the app lesson, a list of encrypted secrets is protected with DES in ECB mode. DES uses a 56-bit key, so only the first eight characters of a key are used, and the keys chosen for the secrets are short, guessable words. Each secret has a hint describing its key. The encrypt and decrypt tool lets you try a key against any text, and a correct guess is also tried against the other secrets.

paragraph.info.4 = Working out which key protects which secret is the same exercise an attacker performs when keys are weak or reused. A wordlist and a tool such as <a href="https://cyberchef.org/" target="_blank">CyberChef</a> can recover short keys in seconds, and <a href="https://github.com/skylot/jadx" target="_blank">jadx</a> will show any key or algorithm embedded in a decompiled APK.

paragraph.info.5 = Strong cryptography on a mobile device means using a modern algorithm such as AES-GCM with a random key and a unique initialisation vector for every operation, and keeping keys in the Android Keystore rather than in code or preferences.

