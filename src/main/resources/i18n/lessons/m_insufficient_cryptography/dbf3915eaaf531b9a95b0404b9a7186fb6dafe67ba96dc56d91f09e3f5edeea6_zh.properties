title.question.m_insufficient_cryptography = 什么是移动加密强度不足?

paragraph.info.1 = 当移动应用使用已弃用或较弱的加密算法、过短的密钥长度、不安全的操作模式或糟糕的密钥管理时，就会出现加密强度不足的问题。常见的例子包括：将 DES（56 位密钥）、RC4、MD5 或 SHA-1 用于安全敏感操作，使用会泄露明文模式的 ECB 分组密码模式，在源代码中硬编码加密密钥，或从静态或可猜测的值派生密钥。

paragraph.info.2 = 即使选择了 AES 这样知名的算法，有缺陷的实现——例如静态初始化向量，或密钥仅仅是应用包名——也可能使加密变得极易破解。由于移动应用可以被反编译，嵌入在 APK 中的任何密钥或算法选择都会暴露给攻击者。

paragraph.info.3 = 本课程演示如何在 Security Shepherd 移动应用中识别并利用弱加密：应用使用一个较短、可猜测的密钥加密存储的值。拦截或提取密文，并破解密钥以读取明文。

paragraph.info.4 = 在应用中触发加密操作，并使用代理或 ADB 观察密文的存储或传输过程。使用 jadx 反编译 APK，定位加密例程并识别算法和密钥。确定密钥后，使用 CyberChef 等工具解密该值。

paragraph.info.5 = OWASP 将最常见的加密缺陷归纳为：使用已弃用的算法（DES、RC4，或将 MD5 用于安全目的）、密钥长度不足、ECB 分组密码模式（会在密文中暂露明文模式）、静态初始化向量，以及糟糕的密钥管理——例如在源代码中硬编码密钥或将其存储在可访问的位置。由于 Android APK 可以使用 jadx 等工具反编译，嵌入应用二进制文件中的任何密钥或算法选择都会暴露给攻击者。

