challenge1.challengeName = Poor Authentication 1
challenge1.para1 = The account is locked \u2014 you cannot log in directly. Tap Forgot Password, then Request Reset Token. Run <code>adb logcat -s PoorAuthChallenge</code> and observe the audit entry \u2014 it logs only the date the reset was requested, never the token itself. Decompile the app to find how the token is derived from the username, the date, and a hardcoded secret, reconstruct it, and enter it to regain access and retrieve the key.
