challenge2.challengeName = Mobile Client Side Injection 2
challenge2.para1 = The database is encrypted with SQLCipher \u2014 direct file extraction will not reveal the data. A product search screen is vulnerable to UNION-based SQL injection, allowing an attacker to query tables beyond the visible products table. A hidden secrets table contains the key.
