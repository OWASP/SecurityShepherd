challenge1.challengeName = Mobile Client Side Injection 1
challenge1.para1 = The database is encrypted with SQLCipher \u2014 direct file extraction will not reveal the credentials. The login view uses an input filter that converts input to uppercase and blocks common SQL keywords including OR, AND, and --. The filter can be bypassed using equivalent SQL operators that it does not block. Login as admin to get the key.


