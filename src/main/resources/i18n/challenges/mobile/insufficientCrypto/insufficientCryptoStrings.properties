challenge1.challengeName = Mobile Insufficient Cryptography Challenge
challenge1.para1 = The app stores a secret value in SharedPreferences, in a file named recovery_vault.xml. Before storage, the app XORs each byte of the value with a hardcoded single-byte key, then Base64-encodes the result. Use adb shell run-as to read the file, decode the Base64 value, then XOR it with the correct byte to reveal the flag.
