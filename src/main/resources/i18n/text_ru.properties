blockedMessage.text.info.levelBlocked = Вы отлично справляетесь! Администратор пометил этот уровень как закрытый. Чтобы узнать когда этот уровень станет доступен, вам придётся спросить человека ответственного за приложение!
getStarted.text.moduleInfo.openFloor = Теперь, когда вы вошли в систему, давайте начнём с нескольких модулей Пастуха Безопасности Чтобы начать модуль, нажмите на заголовки списков <span><a>Уроки</a></span> или <span><a>Модули</a></span> в боковом меню, чтобы увидеть доступные в данный момент модули!
getStarted.text.moduleInfo.incrementalFloor = Теперь, когда вы вошли, давайте начнём с нескольких заданий Пастуха Безопасности! Чтобы начать задание, нажмите кнопку Получить следующее задание слева!
getStarted.text.moduleInfo = Теперь, когда вы вошли , давайте начнём с нескольких модулей Пастуха Безопасности! Чтобы начать модуль, нажмите на такие заголовки списков, как <span><a>Полевое обучение</a></span> или <span><a>Капрал</a></span>, в боковом меню, чтобы увидеть доступные в данный момент модули! Чем ниже модуль расположен в боковом меню, тем больше очков он стоит!
getStarted.text.configureShepherd.asAnAdmin = Поскольку вы администратор, вы можете определить область применения Пастуха Безопасности. С помощью следующих кнопок можно быстро изменить структуру игры, ориентировав её на веб-приложения или мобильные приложения, либо открыть меню управления модулями администратора в левом верхнем углу страницы, чтобы открывать или закрывать отдельные темы.
getStarted.text.checkShepConfigMsg = Если вы не видите сообщение ниже этого абзаца, убедитесь, что экземпляр Пастуха Безопасности настроен правильно.
getStarted.text.info.changePassword = Ваш пароль является временным. Это означает, что кто-то другой его знает! Давайте обеспечим безопасность и изменим ваш пароль сейчас!
getStarted.text.info.changeUsername = Здесь вы можете изменить своё имя пользователя. Это имя будет отображаться публично в таблице лидеров.
login.text.info = Используйте свои <a><span>учётные данные Пастуха Безопасности<span></a> для входа.
login.text.regInfo = Зарегистрируйте здесь <a href="register.jsp"><span>учётную запись Пастуха Безопасности</span></a>!
login.text.scoreboard = Просмотреть <a href="scoreboard.jsp"><span>таблицу лидеров</span></a>.
login.text.about_blurb = Проект OWASP Пастух Безопасности был разработан с целью повышения осведомлённости о безопасности приложений среди пользователей с различным уровнем подготовки. Этот проект позволяет пользователям изучать или совершенствовать имеющиеся навыки ручного тестирования на проникновение. Это достигается с помощью уроков и заданий. Урок предоставляет пользователю подробные инструкции для выполнения соответствующего модуля, а задание позволяет применить на практике знания, полученные в уроке. </p><p>Проект OWASP Пастух Безопасности охватывает десять основных рисков веб-приложений OWASP, а также десять основных рисков мобильных приложений OWASP. Используя эти риски в качестве основы для заданий, можно изучить распространённые уязвимости безопасности и понять их влияние на систему. Многие из этих уровней содержат недостаточные меры устранения и защиты от этих рисков, такие как фильтры чёрных списков, плохие схемы кодирования, варварские механизмы безопасности и плохая конфигурация безопасности. Модули разработаны таким образом, чтобы представлять собой испытание не только для начинающих специалистов по безопасности, но и для профессионалов в области безопасности.
login.text.sponsers_blurb = Проект OWASP Пастух Безопасности хотел бы выразить благодарность своим спонсорам за их щедрую поддержку. Пожалуйста, посетите их веб-страницы и подпишитесь на них в Twitter.
login.text.thanks = Проект OWASP Пастух Безопасности также хотел бы поблагодарить доктора Энтони Кина и лабораторию исследований безопасности ITB за размещение общедоступного сайта https://owasp.securityShepherd.eu
readyToPlay.text.info.notReady = Обновите домашнюю страницу! Если ошибка сохраняется, выйдите из системы и войдите снова! Если ошибка продолжает возникать, обратитесь к администратору!
readyToPlay.text.info.enteredGame = Теперь, когда вы видите это сообщение, всё готово! Приступайте к урокам и заданиям! <br/><br/> Помните, что уровни, которые вы проходите, являются дочерними приложениями. Оставайтесь в пределах этих приложений во время игры! Не изменяйте идентификаторы ваших сессий! Если вы их измените, вы просто выйдете из системы!<br/><br/> Если вы ещё не настроили веб-прокси, обязательно сделайте это! Это значительно упростит работу!

