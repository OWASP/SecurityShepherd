sponsorship.title = Спонсоры проекта
sponsorship.message.1 = Проект OWASP Пастух Безопасности хотел бы выразить благодарность своим спонсорам за их щедрую поддержку. Пастух Безопасности не существовал бы в нынешнем виде без них. Пожалуйста, посетите их веб-страницы и подпишитесь на них в Twitter.