# Classification of Security Shepherd's levels, for the level catalogue in docs/levels.md and
# docs/mobile-levels.md. generate-level-catalogue.py reads this file and the levels in
# src/main/resources/database/coreSchema.sql, and writes the catalogue tables.
#
# Each topic is a moduleCategory from coreSchema.sql. Give it:
# - name: the heading shown in the catalogue
# - top10: the OWASP Top 10 2025 category (web) or OWASP Mobile Top 10 2024 risk (mobile)
# - cwe: the CWE number that best describes the topic
#
# The CWE is chosen per topic, not per level, so the catalogue doesn't hint at how to complete a
# level. The Top 10 category is the one OWASP maps that CWE to in its 2025 edition
# (https://top10.owasp.org/2025/). A level whose vulnerability differs from its topic's, and whose
# name already says so, has an entry under [levels].
#
# A new level in coreSchema.sql needs nothing here unless its topic is new. A new topic needs an
# entry, or the generator fails.

[top10.web]
A01 = { name = "A01:2025 Broken Access Control", url = "https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/" }
A02 = { name = "A02:2025 Security Misconfiguration", url = "https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/" }
A04 = { name = "A04:2025 Cryptographic Failures", url = "https://top10.owasp.org/2025/A04_2025-Cryptographic_Failures/" }
A05 = { name = "A05:2025 Injection", url = "https://top10.owasp.org/2025/A05_2025-Injection/" }
A07 = { name = "A07:2025 Authentication Failures", url = "https://top10.owasp.org/2025/A07_2025-Authentication_Failures/" }

[top10.mobile]
M3 = { name = "M3: Insecure Authentication/Authorization" }
M4 = { name = "M4: Insufficient Input/Output Validation" }
M6 = { name = "M6: Inadequate Privacy Controls" }
M7 = { name = "M7: Insufficient Binary Protections" }
M8 = { name = "M8: Security Misconfiguration" }
M9 = { name = "M9: Insecure Data Storage" }
M10 = { name = "M10: Insufficient Cryptography" }

