name: Docs
# Builds the documentation site from docs/ with Zensical and publishes it to GitHub Pages (#1070).
# Pull requests that change the site build and check it, so a broken link, a missing image or a
# page missing from the nav fails the PR. Pushes to dev that change the site also deploy it, and
# only if the same checks pass, so a broken site is never published. When 4.0.0 is released, the
# deploy moves to master (see docs/releasing.md).
on:
  push:
    branches:
      - dev
    paths: &site-paths
      - 'docs/**'
      - 'zensical.toml'
      - 'zensical-overrides/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/scripts/check-docs-site.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
      - dev
    paths: *site-paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a deployment part-way through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Not called "build": the "core: required CI checks" ruleset requires test.yml's build job by
  # that name.
  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz from the uv 0.13.5 release
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          # A fixed Python, so a newer runner image can't pick one that a locked package has
          # no wheel for (--no-build would then fail).
          python-version: "3.13"
          enable-cache: false
      # --locked fails if uv.lock doesn't match pyproject.toml, and every download is checked
      # against the sha256 in uv.lock. --no-build installs wheels only, so no package's build
      # code runs.
      - name: Install Zensical
        run: uv sync --locked --no-build
      # Strict mode fails on links to pages or anchors that don't exist
      - name: Build the site
        run: uv run --locked --no-sync zensical build --clean --strict
      # Catches what strict mode doesn't: nav entries and pages that don't match, and links to
      # images or other files that don't exist
      - name: Check the built site
        run: uv run --locked --no-sync python .github/scripts/check-docs-site.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
