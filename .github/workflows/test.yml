name: Build and Test
on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      java: ${{ steps.filter.outputs.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            java:
              - 'src/**/*.java'
            src:
              - 'src/**'
              - 'pom.xml'
              - '.mvn/**'
              - 'docker-compose.yml'
              - 'docker/**'
              - '.env'
              - '.github/workflows/test.yml'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical

  lint-java:
    needs: detect-changes
    if: needs.detect-changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check Java formatting (Google Java Format via Spotless)
        run: mvn spotless:check -B

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Maven with Docker Profile
        run: mvn clean install -Pdocker -DskipTests -B
      - name: Docker Compose Build
        run: docker compose build
      - name: Check Tomcat config placeholders were substituted
        run: bash src/test/scripts/tomcat-config-test.sh
      - name: Smoke test the app in the Docker images
        run: bash src/test/scripts/image-smoke-test.sh

  unit-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Unit Tests
        run: mvn test -B -e

  integration-test-shards:
    name: integration-tests (${{ matrix.shard.name }})
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: core
            # Catch new ITs outside the three package groups below.
            tests: '**/*IT,!servlets/admin/**/*IT,!servlets/module/lesson/**/*IT,!servlets/api/**/*IT,!servlets/module/*IT,!servlets/module/challenge/**/*IT'
          - name: admin
            tests: 'servlets/admin/**/*IT'
          - name: lessons
            tests: 'servlets/module/lesson/**/*IT'
          - name: api-and-challenges
            tests: 'servlets/api/**/*IT,servlets/module/*IT,servlets/module/challenge/**/*IT'
    services:
      # Keep in step with DB_VERSION in .env, the MariaDB the Docker image runs
      mysql:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: core
        ports:
          - '8888:3306'
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Modify MySQL Connection Variables
        run: |
          sed -i "s/'@'localhost'/'@'%'/g" "${GITHUB_WORKSPACE}/src/main/resources/database/moduleSchemas.sql"
          sed -i 's/TEST_MYSQL_PORT=3306/TEST_MYSQL_PORT=8888/g' "${GITHUB_WORKSPACE}/.env"
      - name: Prepare Integration Tests
        run: |
          sudo apt-get -y install libargon2-1
          mvn -Pdocker validate
      - name: Run Integration Tests
        env:
          IT_TESTS: ${{ matrix.shard.tests }}
        run: mvn verify -DskipUTs=true -DmongoDocker -B "-Dit.test=$IT_TESTS"

  # Preserve the required check on dev and master when the test job fans out.
  integration-tests:
    needs: [detect-changes, integration-test-shards]
    if: ${{ !cancelled() && needs.detect-changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration shard to pass
        env:
          SHARD_RESULT: ${{ needs.integration-test-shards.result }}
        run: test "$SHARD_RESULT" = success
